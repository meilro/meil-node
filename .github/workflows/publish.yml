name: Publish to npm

# Every push to main: when package.json has a version npm does not have yet,
# it is published, and tagged v<version> on GitHub. A push that leaves the
# version alone publishes nothing.
on:
  push:
    branches: [main]

# One run at a time, so two quick pushes cannot both try the same version:
# the second waits, then sees it is already on npm.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # to push the v<version> tag
  id-token: write # lets npm verify this workflow (trusted publishing, no token needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Is this version already on npm?
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new: publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or newer.
      - if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      # prepublishOnly runs typecheck, tests and build first.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          tag="v${{ steps.check.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
